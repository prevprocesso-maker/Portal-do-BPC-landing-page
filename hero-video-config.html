<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Hero com vídeo em cartão — configuração para reuso</title>
<style>
/* ============================================================
   HERO COM VÍDEO EM CARTÃO — CONFIGURAÇÃO PARA REUSO
   Estrutura: vídeo em cartão arredondado (máx. 980px) com
   badge + título + parágrafo dentro; botões + linha de
   confiança em bloco único logo abaixo.
   Troque as variáveis em :root para adaptar a outra marca.
   ============================================================ */
:root{
  --hero-accent: #d68559;      /* cor do título e badge */
  --hero-text: #ffffff;        /* texto sobre o vídeo */
  --hero-radius: 24px;         /* arredondamento do cartão */
  --hero-max-width: 980px;     /* largura máxima do cartão */
  --hero-min-height: max(46dvh, 380px); /* altura do cartão */
  --hero-btn-primary: #1f7a4d; /* botão principal */
  --font-serif: Georgia, 'Times New Roman', serif;
  --font-sans: 'Helvetica Neue', Arial, sans-serif;
  --muted: #8a8178;            /* linha de confiança */
}
body{margin:0;background:#16100a;font-family:var(--font-sans)}

/* ---- Seção ---- */
.hero{padding:24px 16px 0}
.hero .container{max-width:1200px;margin:0 auto}

/* ---- Cartão do vídeo ---- */
.hero-video{
  position:relative;
  overflow:hidden;
  border-radius:var(--hero-radius);
  min-height:var(--hero-min-height);
  display:flex;align-items:center;justify-content:center;
  background:#000;
  max-width:var(--hero-max-width);
  margin:0 auto;
}
.hero-video .fallback{          /* foto enquanto o vídeo carrega */
  position:absolute;inset:0;
  background-size:cover;background-position:center 20%;
  z-index:0;
}
.hero-video video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:1;
}
.hero-video .overlay{           /* gradiente para legibilidade */
  position:absolute;inset:0;z-index:2;
  background:linear-gradient(0deg, rgba(0,0,0,.65) 0%, rgba(0,0,0,.15) 50%, rgba(0,0,0,.3) 100%);
}

/* ---- Texto dentro do vídeo ---- */
.hero-content{
  position:relative;z-index:3;text-align:center;
  padding:clamp(24px, 5vw, 56px);
  max-width:720px;margin:0 auto;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11.5px;font-weight:700;
  letter-spacing:.22em;text-transform:uppercase;
  color:var(--hero-accent);margin-bottom:18px;
}
.hero-title{
  font-family:var(--font-serif);font-weight:700;
  font-size:clamp(30px, 4.5vw, 48px);
  line-height:1.1;letter-spacing:-.02em;
  color:var(--hero-accent);margin:0 0 16px;
  text-wrap:balance;
}
.hero-title em{font-style:italic;color:var(--hero-text)}
.hero-lead{
  font-size:clamp(15px, 2vw, 17.5px);
  color:rgba(255,255,255,.88);
  line-height:1.6;max-width:500px;margin:0 auto;
  text-wrap:pretty;
}

/* ---- Bloco único abaixo do vídeo ---- */
.hero-actions{
  display:flex;flex-direction:column;align-items:center;
  gap:18px;text-align:center;padding:28px 0 4px;
}
.hero-actions .btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  font-size:17px;padding:15px 28px;border-radius:999px;
  font-weight:700;text-decoration:none;border:none;cursor:pointer;
}
.btn--primary{
  background:var(--hero-btn-primary);color:#fff;
  box-shadow:0 8px 32px rgba(196,103,58,.4);
}
.btn--ghost{
  background:rgba(255,255,255,.1);color:#fff;
  border:1.5px solid rgba(255,255,255,.25);
  backdrop-filter:blur(8px);
}
.hero-trust{
  display:flex;gap:24px;justify-content:center;flex-wrap:wrap;
  color:var(--muted);font-size:14.5px;
}

/* ---- Mobile ---- */
@media (max-width:640px){
  .hero-actions .btn-row{flex-direction:column;width:100%}
  .hero-actions .btn{width:100%;box-sizing:border-box}
}
</style>
</head>
<body>

<!-- ============================================================
     COMO USAR EM OUTRO SITE:
     1. Copie o <style> acima e o bloco <section> abaixo.
     2. Troque os src do <video> e a imagem de fallback.
     3. Ajuste as variáveis em :root (cores, largura, altura).
     4. Edite badge, título, parágrafo, botões e linha ✓.
     ============================================================ -->

<section class="hero">
  <div class="container">

    <!-- Cartão do vídeo: badge + título + parágrafo DENTRO -->
    <div class="hero-video">
      <div class="fallback" style="background-image:url(SUA-FOTO-FALLBACK.jpg)"></div>
      <video autoplay muted loop playsinline preload="metadata">
        <source src="SEU-VIDEO.webm" type="video/webm"/>
        <source src="SEU-VIDEO.mp4" type="video/mp4"/>
      </video>
      <div class="overlay"></div>
      <div class="hero-content">
        <div class="hero-badge">✦ Sua especialidade · Sua cidade</div>
        <h1 class="hero-title">Seu título principal começa <br/><em>aqui</em>.</h1>
        <p class="hero-lead">Seu parágrafo de apoio — uma ou duas frases curtas que explicam a proposta de valor, em linguagem simples e direta.</p>
      </div>
    </div>

    <!-- Bloco único ABAIXO do vídeo: botões + linha de confiança -->
    <div class="hero-actions">
      <div class="btn-row">
        <a class="btn btn--primary" href="#">Ação principal →</a>
        <a class="btn btn--ghost" href="#">Ação secundária</a>
      </div>
      <div class="hero-trust">
        <span>✓ Diferencial 1</span>
        <span>✓ Diferencial 2</span>
        <span>✓ Diferencial 3</span>
      </div>
    </div>

  </div>
</section>

</body>
</html>
