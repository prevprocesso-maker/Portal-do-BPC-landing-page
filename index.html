          { "@type": "HowToStep", "position": 3, "name": "Comportamento na perícia médica", "text": "Chegue 30 minutos antes. Não minimize sua condição. Mostre medicamentos. Use equipamentos de apoio. Tenha acompanhante." },
          { "@type": "HowToStep", "position": 4, "name": "Documentos da perícia social", "text": "Para deficiente: documentos de todos moradores, CadÚnico atualizado, comprovantes de renda e despesas, declaração escolar, fotos da residência." },

        "@id": "https://www.portaldobpc.com.br/#faq",
        "mainEntity": [
          { "@type": "Question", "name": "Idoso de 65+ que recebe pensão por morte do INSS pode receber o BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Em regra, não. O BPC não pode ser acumulado com aposentadoria, pensão por morte, auxílio-doença ou qualquer outro benefício do INSS. A única exceção é a assistência médica e a pensão especial reparatória. Se a pensão recebida for de valor baixo e a renda familiar per capita continuar dentro do limite (até R$ 405,25), em alguns casos é possível renunciar à pensão para pleitear o BPC — mas exige análise técnica." } },
          { "@type": "Question", "name": "Meu filho mora comigo e ganha um salário mínimo. Perco o BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Depende do cálculo per capita. Soma-se TODA a renda da casa (incluindo o salário do filho) e divide pelo número de moradores. Se o resultado ficar até R$ 405,25 por pessoa, o direito ao BPC é mantido." } },
          { "@type": "Question", "name": "Idoso pode receber BPC se continuar fazendo bico ou trabalho informal?", "acceptedAnswer": { "@type": "Answer", "text": "Sim, desde que a renda total da família continue dentro do limite. O BPC não exige que a pessoa pare de trabalhar — exige apenas que a renda familiar per capita seja inferior a ¼ do salário mínimo. Rendas detectadas em IR ou MEI ativo podem cair no pente fino." } },
          { "@type": "Question", "name": "Idoso preso ou em cumprimento de pena pode receber BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Não enquanto estiver recluso. O BPC fica suspenso durante o período de prisão. Quando o idoso é solto, o benefício pode ser restabelecido com cópia do alvará de soltura, comprovação de endereço e CadÚnico atualizado." } },
          { "@type": "Question", "name": "Meu pai faleceu recebendo BPC. A família continua recebendo?", "acceptedAnswer": { "@type": "Answer", "text": "Não. O BPC é intransferível e não gera pensão por morte para os herdeiros. Diferente da aposentadoria, o BPC é pessoal e termina com o falecimento do titular." } },
          { "@type": "Question", "name": "Idoso estrangeiro residente no Brasil tem direito ao BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Sim, desde 2007 (Decreto 6.214/2007). Estrangeiro naturalizado ou com residência permanente comprovada tem o mesmo direito que o brasileiro nato, atendendo aos demais requisitos." } },
          { "@type": "Question", "name": "Tenho laudo médico — basta isso para conseguir o BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Não. O laudo é importante, mas não suficiente. A concessão do BPC para pessoa com deficiência exige aprovação em DUAS perícias do INSS: perícia médica (avalia a deficiência clinicamente) e perícia social (avalia barreiras no dia a dia)." } },
          { "@type": "Question", "name": "Autismo (TEA) sempre dá direito ao BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Não automaticamente. A Lei 12.764/2012 equipara o autismo a deficiência. Porém o BPC depende de (1) impedimentos de longo prazo de 2+ anos limitando participação social, e (2) renda per capita até ¼ do salário mínimo. Autistas nível 2 e 3 costumam obter; nível 1 gera negativa frequente — cabe recurso." } },
          { "@type": "Question", "name": "Posso trabalhar com carteira assinada e receber BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Sim, com regras específicas. A Lei 13.146/2015 criou o BPC Trabalho: a pessoa com deficiência pode aceitar emprego formal, MEI ou aprendizagem, e o BPC fica suspenso (não cessado). Se o emprego acabar, o benefício pode ser reativado sem nova perícia." } },
          { "@type": "Question", "name": "Hipertensão, diabetes e problemas de coluna dão direito ao BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Não automaticamente. Doenças crônicas precisam causar impedimento de longo prazo na vida em sociedade. A perícia avalia FUNÇÃO, não diagnóstico." } },
          { "@type": "Question", "name": "Câncer dá direito automático ao BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Não. Mesmo câncer maligno não gera concessão automática. Exige (1) impedimento de longo prazo (2+ anos), (2) renda familiar dentro do limite, (3) aprovação nas perícias. Câncer avançado tende a deferimento; em remissão raramente." } },
          { "@type": "Question", "name": "Esquizofrenia, depressão grave e transtorno bipolar dão BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Podem dar, exigem comprovação rigorosa. Transtornos psiquiátricos graves (CID F20, F31, F33.2) podem gerar BPC se demonstrarem incapacidade contínua por mais de 2 anos. Necessário histórico psiquiátrico longo, receituários, internações se houver." } },
          { "@type": "Question", "name": "Criança com Síndrome de Down recebe BPC automaticamente?", "acceptedAnswer": { "@type": "Answer", "text": "Sim, com prioridade. Lei 13.146/2015 e Decreto 6.214/2007 garantem o direito. A Súmula 78 da TNU dispensa a perícia de longo prazo — basta comprovar diagnóstico (cariótipo 47, XX/XY+21) e renda familiar." } },
          { "@type": "Question", "name": "Bolsa Família entra no cálculo da renda familiar para o BPC?", "acceptedAnswer": { "@type": "Answer", "text": "NÃO. O artigo 20-A da LOAS é expresso: Bolsa Família e antigo Auxílio Brasil NÃO entram no cálculo do per capita para fins de BPC. Outros benefícios sociais também são isentos." } },
          { "@type": "Question", "name": "Marido se separou mas continua morando em casa. Conta como família?", "acceptedAnswer": { "@type": "Answer", "text": "Sim. O conceito de família para o BPC é quem MORA NA MESMA CASA, independentemente de vínculo afetivo ou jurídico. Para excluir alguém é preciso comprovar residência separada." } },
          { "@type": "Question", "name": "Pensão alimentícia recebida entra na renda do BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Sim. Pensão alimentícia recebida entra no cálculo. Pensão alimentícia PAGA NÃO é deduzida desde 2015." } },
          { "@type": "Question", "name": "Aluguel de quartinho ou cômodo entra na renda?", "acceptedAnswer": { "@type": "Answer", "text": "Sim. Qualquer renda em dinheiro entra no cálculo, incluindo aluguel de quarto, cômodo, garagem ou imóvel, mesmo aluguel informal." } },
          { "@type": "Question", "name": "Filho com BPC mora em casa. A renda dele conta para meu BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Em regra sim, mas a Súmula 79 da TNU determina que o BPC de outro morador NÃO entra no cálculo de novo pedido de BPC no mesmo grupo familiar. O INSS frequentemente desconhece — cabe recurso." } },
          { "@type": "Question", "name": "Quanto tempo o INSS leva para analisar o pedido de BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Até 90 dias por lei. BPC idoso: 30 a 60 dias. BPC deficiente: CD: 90 a 180 dias (duas perícias). Atrasos podem ser denunciados via Ouvidoria, MPF ou mandado de segurança." } },
          { "@type": "Question", "name": "O INSS negou meu BPC. Como funciona o recurso?", "acceptedAnswer": { "@type": "Answer", "text": "30 dias para recurso administrativo no INSS (gratuito). Se negado novamente, cabe ação judicial. Estatísticas: 40% revertidos administrativamente; 60-70% na esfera judicial." } },
          { "@type": "Question", "name": "Como funciona a perícia médica do INSS para BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Agendada via Meu INSS. Em média 15 minutos. O perito lê laudos mas dá mais peso à observação do momento. Leve todos os laudos, exames, receituários, declarações escolares." } },
          { "@type": "Question", "name": "Posso pedir o BPC sozinho no Meu INSS, sem advogado?", "acceptedAnswer": { "@type": "Answer", "text": "Sim. Requerimento gratuito pelo Meu INSS ou ligando 135. Advogado se justifica em: negativa do INSS, judicialização, casos complexos." } },
          { "@type": "Question", "name": "Caí no pente fino e meu BPC foi suspenso. Como restabelecer?", "acceptedAnswer": { "@type": "Answer", "text": "Identificar motivo no Meu INSS. Comum: CadÚnico desatualizado (atualizar no CRAS), renda acima do limite, auditoria do TCU/CGU (defesa em 30 dias). Sem defesa, benefício é cessado." } },
          { "@type": "Question", "name": "Preciso fazer o CadÚnico ANTES de pedir o BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Sim, obrigatoriamente desde 2016 (Decreto 8.805). Sem cadastro ativo no CadÚnico, o INSS automaticamente nega. Cadastro gratuito no CRAS. Validade: 2 anos." } },
          { "@type": "Question", "name": "Meu CadÚnico está desatualizado. O que pode acontecer?", "acceptedAnswer": { "@type": "Answer", "text": "Risco alto de cessação do BPC. Após 2 anos vence. INSS pode suspender automaticamente. Solução: atualizar no CRAS e pedir restabelecimento no Meu INSS." } },
          { "@type": "Question", "name": "O BPC dá direito a Vale-Gás e Tarifa Social de Energia?", "acceptedAnswer": { "@type": "Answer", "text": "Sim. Como beneficiário do BPC no CadÚnico: Tarifa Social de Energia (10-65% desconto), Vale-Gás bimestral, ID Jovem, isenções municipais de transporte, isenção IPVA em alguns estados." } },
          { "@type": "Question", "name": "Posso ter conta poupança ou conta conjunta recebendo BPC?", "acceptedAnswer": { "@type": "Answer", "text": "Sim. Não há proibição de conta bancária para beneficiário do BPC. Conta corrente, poupança, digital ou conjunta permitidas. Movimentações altas e salários recebidos podem gerar questionamento do INSS via cruzamento Bacen." } },
          { "@type": "Question", "name": "Qual o valor do BPC em 2026?", "acceptedAnswer": { "@type": "Answer", "text": "Um salário mínimo mensal: R$ 1.621,00 em 2026. Reajustado anualmente. Não há 13º salário (benefício assistencial)." } }
        ]
      },

        localStorage.setItem(key, 'granted');
