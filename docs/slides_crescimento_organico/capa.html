<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --terra-500: #c4673a;
            --wa: #075e54;
            --ink-900: #2d2621;
            --bone: #faf5eb;
        }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: var(--bone);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--ink-900);
        }
        .bg-shape-1 {
            position: absolute;
            top: -100px;
            right: -100px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(196,103,58,0.1) 0%, rgba(196,103,58,0.3) 100%);
            z-index: 1;
        }
        .bg-shape-2 {
            position: absolute;
            bottom: -150px;
            left: -50px;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(7,94,84,0.05) 0%, rgba(7,94,84,0.15) 100%);
            z-index: 1;
        }
        .content-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 900px;
        }
        .tag {
            display: inline-block;
            background-color: var(--wa);
            color: white;
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 24px;
            color: var(--ink-900);
        }
        h1 span {
            color: var(--terra-500);
        }
        h2 {
            font-size: 32px;
            font-weight: 400;
            color: #5a4f45;
            line-height: 1.4;
            margin-bottom: 60px;
        }
        .domain-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background-color: white;
            padding: 16px 32px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            font-size: 24px;
            font-weight: 600;
            color: var(--terra-500);
        }
        .domain-badge svg {
            width: 28px;
            height: 28px;
            fill: var(--wa);
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="bg-shape-1"></div>
        <div class="bg-shape-2"></div>
        
        <div class="content-wrapper">
            <div class="tag">Plano Estratégico</div>
            <h1>Crescimento Orgânico<br><span>Portal do BPC</span></h1>
            <h2>Estratégia de SEO, Link Building Ético e<br>Visibilidade em Respostas de Inteligência Artificial</h2>
            
            <div class="domain-badge">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                </svg>
                portaldobpc.com.br
            </div>
        </div>
    </div>
</body>
</html>
