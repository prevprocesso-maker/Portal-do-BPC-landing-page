<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Por onde começo? — Portal do BPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 90% at 50% -10%, #2a2018 0%, #1b1410 45%, var(--cream) 80%),
      var(--cream);
    color:var(--ink-900);
    font-family:var(--font-sans);
    min-height:100vh;
    line-height:var(--leading-normal);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:680px;margin:0 auto;
    padding:clamp(28px,5vw,64px) clamp(20px,5vw,32px) 64px;
    min-height:100vh;display:flex;flex-direction:column;
  }

  /* ---- top bar ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:clamp(28px,5vw,48px);}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .brand img{width:40px;height:40px;}
  .brand .bn{font-family:var(--font-serif);font-weight:700;font-size:18px;color:var(--ink-900);line-height:1;}
  .brand .bs{font-size:10px;font-weight:600;letter-spacing:.22em;color:var(--terra-400);margin-top:3px;}
  .back{
    display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    background:var(--bone);border:1.5px solid var(--line);border-radius:999px;
    padding:10px 18px;margin-bottom:18px;cursor:pointer;
    font-family:var(--font-sans);font-size:14px;font-weight:600;color:var(--ink-500);
    transition:color .15s,border-color .15s,background .15s;
  }
  .back:hover{color:var(--terra-300);border-color:var(--terra-700);background:var(--bone-2);}
  .back:focus-visible{outline:3px solid var(--terra-500);outline-offset:2px;}
  .back[hidden]{display:none;}

  /* ---- progress ---- */
  .progress{display:flex;gap:8px;margin-bottom:clamp(26px,4vw,40px);}
  .progress span{height:5px;flex:1;border-radius:99px;background:var(--line);transition:background .3s;}
  .progress span.on{background:linear-gradient(90deg,var(--terra-500),var(--terra-300));}

  /* ---- step ---- */
  .step{animation:fade .35s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .eyebrow{
    font-size:13px;font-weight:600;letter-spacing:var(--tracking-eyebrow);
    text-transform:uppercase;color:var(--terra-400);margin-bottom:14px;
  }
  .q{
    font-family:var(--font-serif);font-weight:700;
    font-size:clamp(1.9rem,4.5vw,2.6rem);line-height:1.12;letter-spacing:var(--tracking-tight);
    color:var(--ink-900);margin-bottom:10px;text-wrap:balance;
  }
  .q-sub{font-size:17px;color:var(--ink-500);margin-bottom:28px;max-width:42ch;}

  /* ---- option cards ---- */
  .opts{display:flex;flex-direction:column;gap:12px;}
  .opt{
    display:flex;align-items:center;gap:16px;
    width:100%;text-align:left;cursor:pointer;
    background:var(--bone);border:1.5px solid var(--line);
    border-radius:16px;padding:18px 20px;min-height:68px;
    font-family:var(--font-sans);color:var(--ink-900);
    transition:border-color .15s,background .15s,transform .1s;
  }
  .opt:hover{border-color:var(--terra-700);background:var(--bone-2);}
  .opt:active{transform:scale(.99);}
  .opt:focus-visible{outline:3px solid var(--terra-500);outline-offset:2px;}
  .opt .ic{
    flex:0 0 auto;width:46px;height:46px;border-radius:12px;
    background:var(--olive-100);color:var(--terra-300);
    display:flex;align-items:center;justify-content:center;
  }
  .opt .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;}
  .opt .tx b{display:block;font-size:18px;font-weight:600;line-height:1.25;}
  .opt .tx small{display:block;font-size:14px;color:var(--ink-500);margin-top:2px;}
  .opt .arrow{margin-left:auto;color:var(--ink-300);font-size:22px;transition:color .15s,transform .15s;}
  .opt:hover .arrow{color:var(--terra-400);transform:translateX(3px);}

  /* ---- result ---- */
  .result{animation:fade .4s ease both;}
  .result .ack{
    background:var(--err-bg);border:1px solid rgba(217,121,112,.3);
    border-radius:16px;padding:20px 22px;margin-bottom:26px;
    display:flex;gap:14px;align-items:flex-start;
  }
  .result .ack svg{flex:0 0 auto;width:26px;height:26px;stroke:var(--err);fill:none;stroke-width:1.8;margin-top:2px;}
  .result .ack p{font-size:17px;color:var(--ink-900);line-height:1.5;}
  .result .ack p b{color:#eaa9a2;}

  .roteiro{margin-bottom:14px;}
  .roteiro h2{
    font-family:var(--font-serif);font-weight:700;font-size:1.5rem;
    color:var(--ink-900);margin-bottom:20px;
  }
  .stepitem{display:flex;gap:16px;padding:16px 0;border-top:1px solid var(--line);}
  .stepitem:first-of-type{border-top:none;}
  .stepitem .n{
    flex:0 0 auto;width:34px;height:34px;border-radius:50%;
    background:var(--terra-500);color:#fff;font-weight:700;font-size:16px;
    display:flex;align-items:center;justify-content:center;
  }
  .stepitem .c b{display:block;font-size:17px;font-weight:600;color:var(--ink-900);margin-bottom:3px;}
  .stepitem .c span{font-size:15px;color:var(--ink-500);line-height:1.5;}

  .alert{
    display:flex;gap:12px;align-items:flex-start;
    background:var(--warn-bg);border:1px solid rgba(224,178,64,.3);
    border-radius:14px;padding:15px 18px;margin:18px 0 6px;
  }
  .alert svg{flex:0 0 auto;width:22px;height:22px;stroke:var(--warn);fill:none;stroke-width:1.8;}
  .alert p{font-size:15px;color:var(--ink-900);line-height:1.45;}
  .alert b{color:#e9c879;}

  /* ---- CTA block ---- */
  .cta{
    margin-top:30px;padding-top:28px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:14px;
  }
  .btn{
    font-family:var(--font-sans);font-size:17px;font-weight:600;border-radius:999px;
    padding:16px 26px;border:1.5px solid transparent;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    text-decoration:none;min-height:56px;transition:background .15s,transform .1s,border-color .15s;
  }
  .btn:active{transform:translateY(1px);}
  .btn--wa{background:#117a52;color:#fff;box-shadow:0 8px 24px rgba(17,122,82,.3);}
  .btn--wa:hover{background:#0d6543;}
  .btn--wa svg{width:24px;height:24px;fill:#fff;}
  .btn--ghost{background:transparent;color:var(--terra-300);border-color:var(--line);}
  .btn--ghost:hover{background:var(--bone);border-color:var(--terra-700);}
  .restart{align-self:center;background:none;border:none;color:var(--ink-500);font-size:14px;font-weight:600;cursor:pointer;padding:10px;margin-top:4px;text-decoration:underline;text-underline-offset:3px;}
  .restart:hover{color:var(--terra-300);}

  .reassure{margin-top:auto;padding-top:32px;text-align:center;font-size:13px;color:var(--ink-300);}
  .reassure b{color:var(--ink-500);font-weight:600;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="index.html">
        <img src="assets/logo-monograma-cc.png" alt="" />
        <span><span class="bn">Portal do BPC</span><span class="bs">CARLOS COSTA · ESPECIALISTA</span></span>
      </a>
    </div>

    <button class="back" id="back">← Voltar</button>

    <div class="progress" id="progress"><span></span><span></span><span></span></div>

    <div id="app"></div>

    <p class="reassure">Orientação <b>100% gratuita e sem compromisso</b>. Suas respostas ficam só com você.</p>
  </div>

  <script src="triagem.js"></script>
</body>
</html>
